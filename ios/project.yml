name: PixelLedger
configs:
  Debug: debug
  Release: release
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  PixelLedger:
    type: application
    platform: iOS
    sources:
      - path: PixelLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pixelledger
        INFOPLIST_FILE: PixelLedger/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          API_BASE_URL: http://127.0.0.1:8080
        Release:
          API_BASE_URL: https://api.example.com
