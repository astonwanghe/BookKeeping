name: PixelLedger
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  PixelLedger:
    type: application
    platform: iOS
    sources:
      - path: PixelLedger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pixelledger
        INFOPLIST_FILE: PixelLedger/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
