spring:
  application.name: pixel-ledger-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${MYSQL_DATABASE:pixel_ledger}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:pixel_ledger}
    password: ${MYSQL_PASSWORD:pixel_ledger}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp.auth: true
    properties.mail.smtp.starttls.enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  error.include-message: never
app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:}
